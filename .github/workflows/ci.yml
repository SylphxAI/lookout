name: CI

on:
  merge_group:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Assert pinned Bun
        run: test "$(bun --version)" = "1.4.0"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Doctor
        run: bun src/cli.ts doctor
      - name: Release gate
        run: bun scripts/release-gate.ts
