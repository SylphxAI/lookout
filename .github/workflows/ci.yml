name: CI

on:
  merge_group:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile || bun install
      - name: Test
        run: bun test
      - name: Doctor
        run: bun src/cli.ts doctor || ./bin/lookout doctor
      - name: Release gate
        run: bun scripts/release-gate.ts
